<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test — action buttons</title>
    <link rel="stylesheet" href="test-fixtures.css">
    <style>
        web-multiselect { display: block; max-width: 320px; }
    </style>
</head>
<body>
    <h1>action buttons</h1>
    <p>Targeted by <code>e2e/action-buttons.spec.ts</code>.</p>

    <div class="fixture">
        <div class="fixture-label">select-all / clear-all (built-ins)</div>
        <web-multiselect id="builtins" value-member="value" display-value-member="label"></web-multiselect>
    </div>

    <div class="fixture">
        <div class="fixture-label">custom action (counts clicks)</div>
        <web-multiselect id="custom" value-member="value" display-value-member="label"></web-multiselect>
    </div>

    <div class="fixture">
        <div class="fixture-label">dynamic visibility + disabled callbacks</div>
        <web-multiselect id="dynamic" value-member="value" display-value-member="label"></web-multiselect>
    </div>

    <div class="fixture">
        <div class="fixture-label">sticky actions</div>
        <web-multiselect id="sticky" sticky-actions="true" value-member="value" display-value-member="label"></web-multiselect>
    </div>

    <div class="fixture">
        <div class="fixture-label">actions-layout="wrap"</div>
        <web-multiselect id="wrap" actions-layout="wrap" value-member="value" display-value-member="label"></web-multiselect>
    </div>

    <div class="fixture">
        <div class="fixture-label">select-all + per-item onSelect tracker</div>
        <web-multiselect id="tracker" value-member="value" display-value-member="label"></web-multiselect>
    </div>

    <div class="fixture">
        <div class="fixture-label">action context (additive 2nd arg)</div>
        <web-multiselect id="ctx" value-member="value" display-value-member="label"></web-multiselect>
    </div>

    <script type="module">
        import '/src/index.ts';

        const items = Array.from({ length: 8 }, (_, i) => ({
            value: `item-${i}`,
            label: `Item ${i}`
        }));

        customElements.whenDefined('web-multiselect').then(() => {
            for (const id of ['builtins', 'custom', 'dynamic', 'sticky', 'wrap', 'tracker', 'ctx']) {
                document.getElementById(id).options = items;
            }

            // Built-ins
            document.getElementById('builtins').actionButtons = [
                { action: 'select-all', text: 'Select all' },
                { action: 'clear-all',  text: 'Clear all'  }
            ];

            // Custom action — increments a counter on click
            window.__customClicks = 0;
            document.getElementById('custom').actionButtons = [
                {
                    action: 'custom',
                    text: 'Click me',
                    cssClass: 'js-custom',
                    onClick: () => { window.__customClicks++; }
                }
            ];

            // Dynamic visibility + disabled
            window.__dynamicVisible = false;
            window.__dynamicDisabled = true;
            document.getElementById('dynamic').actionButtons = [
                {
                    action: 'custom',
                    text: 'Maybe Visible',
                    cssClass: 'js-maybe-visible',
                    onClick: () => {},
                    getIsVisibleCallback: () => window.__dynamicVisible
                },
                {
                    action: 'custom',
                    text: 'Maybe Disabled',
                    cssClass: 'js-maybe-disabled',
                    onClick: () => {},
                    getIsDisabledCallback: () => window.__dynamicDisabled
                }
            ];

            // Sticky and wrap
            const stickyAndWrapButtons = [
                { action: 'select-all', text: 'Select all' },
                { action: 'clear-all',  text: 'Clear all'  }
            ];
            document.getElementById('sticky').actionButtons = stickyAndWrapButtons;

            const manyButtons = [
                { action: 'select-all', text: 'Select all' },
                { action: 'clear-all',  text: 'Clear all'  },
                { action: 'custom',     text: 'Button A', onClick: () => {} },
                { action: 'custom',     text: 'Button B', onClick: () => {} },
                { action: 'custom',     text: 'Button C', onClick: () => {} },
                { action: 'custom',     text: 'Button D', onClick: () => {} }
            ];
            document.getElementById('wrap').actionButtons = manyButtons;

            // Tracker — counts per-item onSelect fires
            const tracker = document.getElementById('tracker');
            window.__trackerSelected = [];
            window.__trackerDeselected = [];
            // The on* properties are real listeners — each receives the CustomEvent.
            tracker.onSelect = (e) => { window.__trackerSelected.push(e.detail.option.value); };
            tracker.onDeselect = (e) => { window.__trackerDeselected.push(e.detail.option.value); };
            tracker.actionButtons = [
                { action: 'select-all', text: 'Select all' },
                { action: 'clear-all',  text: 'Clear all'  }
            ];

            // Action context — callbacks read the additive 2nd arg (state + controller).
            window.__ctxSeen = null;
            const ctxEl = document.getElementById('ctx');
            ctxEl.actionButtons = [
                {
                    action: 'select-all',
                    // Dynamic text driven entirely by the 2nd-arg context's live counts.
                    text: 'Select all',
                    getTextCallback: (_ms, ctx) => `Selected ${ctx.selectedCount}/${ctx.optionCount}`
                },
                {
                    action: 'custom',
                    text: 'Ctx',
                    cssClass: 'js-ctx',
                    onClick: (_ms, ctx) => {
                        // Snapshot the context shape, then drive the picker through the controller.
                        window.__ctxSeen = {
                            selectedCount: ctx.selectedCount,
                            optionCount: ctx.optionCount,
                            isOpen: ctx.isOpen,
                            presentation: ctx.presentation,
                            searchTerm: ctx.searchTerm,
                            buttonAction: ctx.button?.action,
                            hasController: typeof ctx.controller?.setSelected === 'function',
                            elementIsHost: ctx.element === ctxEl
                        };
                        ctx.controller.setSelected(['item-0', 'item-1'], { notify: true });
                    }
                }
            ];
        });
    </script>
</body>
</html>
